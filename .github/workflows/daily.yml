name: Daily Commit

on:
  schedule:
    - cron: "0 6 * * *"  # Каждый день в 6:00 UTC (9:00 по Москве)
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make daily commit
        run: |
          echo "$(date) - daily activity" >> daily-update.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: daily activity update"
          git push
